<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <!-- Network Fractal — Branching intelligence alternative mark -->
  <!-- Trunk branches -->
  <line x1="100" y1="30" x2="60" y2="80" stroke="#000000" stroke-width="3"/>
  <line x1="100" y1="30" x2="140" y2="80" stroke="#000000" stroke-width="3"/>
  <!-- Second level -->
  <line x1="60" y1="80" x2="40" y2="130" stroke="#000000" stroke-width="2"/>
  <line x1="60" y1="80" x2="80" y2="130" stroke="#000000" stroke-width="2"/>
  <line x1="140" y1="80" x2="120" y2="130" stroke="#000000" stroke-width="2"/>
  <line x1="140" y1="80" x2="160" y2="130" stroke="#000000" stroke-width="2"/>
  <!-- Sub-branches -->
  <line x1="40" y1="130" x2="30" y2="165" stroke="#000000" stroke-width="1.2"/>
  <line x1="40" y1="130" x2="50" y2="165" stroke="#000000" stroke-width="1.2"/>
  <line x1="80" y1="130" x2="70" y2="165" stroke="#000000" stroke-width="1.2"/>
  <line x1="80" y1="130" x2="90" y2="165" stroke="#000000" stroke-width="1.2"/>
  <line x1="120" y1="130" x2="110" y2="165" stroke="#000000" stroke-width="1.2"/>
  <line x1="120" y1="130" x2="130" y2="165" stroke="#000000" stroke-width="1.2"/>
  <line x1="160" y1="130" x2="150" y2="165" stroke="#000000" stroke-width="1.2"/>
  <line x1="160" y1="130" x2="170" y2="165" stroke="#000000" stroke-width="1.2"/>
  <!-- Nodes -->
  <circle cx="100" cy="30" r="6" fill="#000000"/>
  <circle cx="60" cy="80" r="5" fill="#000000"/>
  <circle cx="140" cy="80" r="5" fill="#000000"/>
  <circle cx="40" cy="130" r="3.5" fill="#000000"/>
  <circle cx="80" cy="130" r="3.5" fill="#000000"/>
  <circle cx="120" cy="130" r="3.5" fill="#000000"/>
  <circle cx="160" cy="130" r="3.5" fill="#000000"/>
  <circle cx="30" cy="165" r="2" fill="#000000"/>
  <circle cx="50" cy="165" r="2" fill="#000000"/>
  <circle cx="70" cy="165" r="2" fill="#000000"/>
  <circle cx="90" cy="165" r="2" fill="#000000"/>
  <circle cx="110" cy="165" r="2" fill="#000000"/>
  <circle cx="130" cy="165" r="2" fill="#000000"/>
  <circle cx="150" cy="165" r="2" fill="#000000"/>
  <circle cx="170" cy="165" r="2" fill="#000000"/>
</svg>
